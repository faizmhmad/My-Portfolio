<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SendBot — Instant Chat Assistant</title>
<style>
  :root{
    --cream:#f6f3ec;
    --ink:#1f2a24;
    --moss:#2e5c47;
    --moss-light:#e5efe8;
    --sun:#e8b74b;
    --line:#d8d2c3;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Georgia', 'Times New Roman', serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:40px 16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:6px;
  }
  .brand .dot{
    width:14px;height:14px;border-radius:50%;
    background:var(--sun);
    box-shadow:0 0 0 4px var(--moss-light);
  }
  h1{
    font-size:2rem;
    letter-spacing:0.5px;
    font-weight:normal;
  }
  .sub{
    font-family:Arial, sans-serif;
    color:#6b7268;
    font-size:0.85rem;
    letter-spacing:1px;
    margin-bottom:28px;
    text-transform:uppercase;
  }

  .chatWrap{
    width:100%;
    max-width:520px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 20px 40px -20px rgba(46,92,71,0.25);
  }
  .chatHead{
    background:var(--moss);
    color:#fff;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:Arial, sans-serif;
  }
  .chatHead .who{display:flex;align-items:center;gap:10px;}
  .avatar{
    width:34px;height:34px;border-radius:50%;
    background:var(--sun);
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;color:var(--moss);
  }
  .statusDot{width:8px;height:8px;border-radius:50%;background:#7ee08a;display:inline-block;margin-right:6px;}

  .messages{
    height:420px;
    overflow-y:auto;
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
    background:
      repeating-linear-gradient(transparent, transparent 39px, var(--moss-light) 40px);
    background-color:#fbfaf6;
  }
  .msg{
    max-width:75%;
    padding:10px 14px;
    border-radius:14px;
    font-family:Arial, sans-serif;
    font-size:0.92rem;
    line-height:1.4;
    animation:pop .18s ease;
  }
  @keyframes pop{from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;}}
  .bot{
    align-self:flex-start;
    background:var(--moss-light);
    color:var(--ink);
    border-bottom-left-radius:4px;
  }
  .user{
    align-self:flex-end;
    background:var(--moss);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .typing{
    align-self:flex-start;
    background:var(--moss-light);
    padding:10px 16px;
    border-radius:14px;
    border-bottom-left-radius:4px;
    display:flex;
    gap:4px;
  }
  .typing span{
    width:6px;height:6px;background:var(--moss);border-radius:50%;
    animation:bounce 1.2s infinite;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

  .quickReplies{
    display:flex;
    gap:8px;
    padding:0 20px 14px;
    flex-wrap:wrap;
    background:#fbfaf6;
  }
  .qr{
    font-family:Arial, sans-serif;
    font-size:0.78rem;
    padding:6px 12px;
    border:1px solid var(--moss);
    color:var(--moss);
    border-radius:20px;
    background:#fff;
    cursor:pointer;
    transition:.15s;
  }
  .qr:hover{background:var(--moss);color:#fff;}

  .inputRow{
    display:flex;
    border-top:1px solid var(--line);
    background:#fff;
  }
  .inputRow input{
    flex:1;
    border:none;
    padding:16px 18px;
    font-family:Arial, sans-serif;
    font-size:0.95rem;
    outline:none;
    background:transparent;
  }
  .sendBtn{
    background:var(--sun);
    border:none;
    padding:0 26px;
    font-family:Arial, sans-serif;
    font-weight:bold;
    color:var(--moss);
    cursor:pointer;
    letter-spacing:1px;
    transition:.15s;
  }
  .sendBtn:hover{background:#dba830;}

  footer{
    margin-top:24px;
    color:#8a9089;
    font-family:Arial, sans-serif;
    font-size:0.75rem;
    letter-spacing:1px;
  }
</style>
</head>
<body>

<div class="brand"><div class="dot"></div><h1>SendBot</h1></div>
<div class="sub">plain HTML chat assistant — no server needed</div>

<div class="chatWrap">
  <div class="chatHead">
    <div class="who">
      <div class="avatar">S</div>
      <div>
        <div style="font-weight:bold;">SendBot</div>
        <div style="font-size:0.72rem;opacity:0.85;"><span class="statusDot"></span>online</div>
      </div>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">Namaste! Main SendBot hoon 👋 Aap mujhse kuch bhi pooch sakte ho.</div>
  </div>

  <div class="quickReplies">
    <div class="qr" data-msg="Tum kya kar sakte ho?">Tum kya kar sakte ho?</div>
    <div class="qr" data-msg="Time kya hua hai?">Time?</div>
    <div class="qr" data-msg="Ek joke sunao">Joke sunao</div>
    <div class="qr" data-msg="Thanks">Thanks</div>
  </div>

  <div class="inputRow">
    <input type="text" id="userInput" placeholder="Apna message likho..." autocomplete="off">
    <button class="sendBtn" id="sendBtn">SEND</button>
  </div>
</div>

<footer>SendBot © 2026 — rule-based demo, HTML/CSS/JS only</footer>

<script>
const messagesEl = document.getElementById('messages');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

const jokes = [
  "Teacher: tum late kyu ho? Student: sir sapne mein bhi jaldi nahi uth paya 😄",
  "Main AI hoon, isliye mujhe 'bug' nahi 'feature' kehte hain 🐛➡️✨",
  "Do robots ki shaadi ho gayi... reception mein sab log 'byte' kha rahe the 🍰"
];

function addMessage(text, sender){
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping(){
  const t = document.createElement('div');
  t.className = 'typing';
  t.id = 'typingIndicator';
  t.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(t);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping(){
  const t = document.getElementById('typingIndicator');
  if(t) t.remove();
}

function getReply(msg){
  const m = msg.toLowerCase();
  if(m.includes('hi') || m.includes('hello') || m.includes('namaste')) return "Hello! Aaj main aapki kaise madad kar sakta hoon?";
  if(m.includes('naam')) return "Mera naam SendBot hai — ek simple HTML chatbot 🙂";
  if(m.includes('kya kar sakte') || m.includes('kya kar sakti') || m.includes('help')) return "Main baaton ka jawab de sakta hoon, jokes suna sakta hoon, aur time bata sakta hoon. Bas type karo!";
  if(m.includes('time')) return "Abhi time hai: " + new Date().toLocaleTimeString('en-IN');
  if(m.includes('date') || m.includes('tarikh')) return "Aaj ki date hai: " + new Date().toLocaleDateString('en-IN');
  if(m.includes('joke')) return jokes[Math.floor(Math.random()*jokes.length)];
  if(m.includes('thanks') || m.includes('dhanyavad') || m.includes('shukriya')) return "Aapka swagat hai! 😊";
  if(m.includes('bye') || m.includes('alvida')) return "Bye bye! Phir milte hain 👋";
  if(m.includes('kaise ho') || m.includes('how are you')) return "Main ek chatbot hoon, hamesha theek rehta hoon! Aap kaise ho?";
  return "Interesting! Mujhe abhi is baare mein zyada nahi pata, lekin main seekh raha hoon 🙂";
}

function handleSend(){
  const text = input.value.trim();
  if(!text) return;
  addMessage(text, 'user');
  input.value = '';
  showTyping();
  setTimeout(()=>{
    removeTyping();
    addMessage(getReply(text), 'bot');
  }, 600 + Math.random()*500);
}

sendBtn.addEventListener('click', handleSend);
input.addEventListener('keydown', e=>{ if(e.key==='Enter') handleSend(); });

document.querySelectorAll('.qr').forEach(qr=>{
  qr.addEventListener('click', ()=>{
    input.value = qr.dataset.msg;
    handleSend();
  });
});
</script>
</body>
</html>
